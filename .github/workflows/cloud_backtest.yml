name: Cloud Backtest (Regime Windows)

# NOTE: this was previously `on: push` for [main, master], meaning it ran
# on EVERY push to main and was guaranteed to fail at the "Install freqtrade"
# step -- there is no freqtrade/ directory anywhere in this repository (nor
# a user_data/ directory for the upload step), so `pip install -e ./freqtrade`
# always errors with "No such file or directory". regime_windows_backtest.py
# hard-codes the same nonexistent paths (freqtrade/config.backtest.json,
# user_data/strategies). Freqtrade is a separate, unrelated trading-bot
# framework -- this looks like a leftover/copy-pasted workflow that was never
# actually wired up to this Alpaca/PyTorch bot. Restricted to manual dispatch
# so it stops guaranteeing a red CI check on every push; re-add the `push`
# trigger once (or if) the freqtrade/ and user_data/ directories this
# workflow depends on actually exist in the repo.
on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install freqtrade (from repo source)
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -e ./freqtrade

      - name: Run regime-window backtest
        run: |
          python regime_windows_backtest.py

      - name: Upload backtest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: user_data/backtest_results/
          retention-days: 30