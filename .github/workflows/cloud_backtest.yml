name: Cloud Backtest (Regime Windows)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install freqtrade (from repo source)
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -e ./freqtrade

      - name: Run regime-window backtest
        run: |
          python regime_windows_backtest.py

      - name: Upload backtest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: user_data/backtest_results/
          retention-days: 30