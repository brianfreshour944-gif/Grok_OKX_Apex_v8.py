[pytest]
# tests/ imports repo-root modules directly (config, money, orders, ...).
# `python -m pytest` adds the CWD to sys.path as a side effect of `-m` and
# masked this locally, but the bare `pytest` command (which CI uses) does
# not get that side effect -- only `tests/` itself lands on sys.path (for
# conftest.py), not the repo root. Declaring pythonpath explicitly makes
# this work the same way regardless of how pytest is invoked.
pythonpath = .
